name: Application Security Scans
description: Scans the checked-out project for secrets and SAST findings.

inputs:
  gitleaks_version:
    description: Gitleaks release version
    required: false
    default: "8.30.1"
  semgrep_rules:
    description: Semgrep ruleset
    required: false
    default: "p/default"

runs:
  using: composite
  steps:
    - name: Scan secrets with Gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
      run: |
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz gitleaks
        ./gitleaks git --redact -v --exit-code 1

    - name: Run Semgrep SAST
      uses: semgrep/semgrep-action@v1
      with:
        config: ${{ inputs.semgrep_rules }}
