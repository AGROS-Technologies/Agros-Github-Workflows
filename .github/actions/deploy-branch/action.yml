name: Deploy Branch to VPS
description: Provisions VPS tooling, computes a port, publishes nginx/docker-compose config, links Hostinger DNS + certbot, and runs the container from GHCR.

inputs:
  target-branch:
    required: true
    description: 'Target Branch to Deploy'
  environment:
    required: true
    description: '"DEV", "TEST", or "PROD"'
  image-name:
    required: false
    description: 'Full GHCR image name matching the CI workflow'
    default: ''
  vps-ip:
    required: true
    description: 'VPS IP'
  vps-key:
    required: true
    description: 'VPS Access Key'
  vps-username:
    required: true
    description: 'VPS Username Connection'
  github-token:
    required: true
    description: 'GitHub Access Token for GHCR authentication'
  hostinger-dns:
    required: true
    description: 'Hostinger DNS Base Domain'
  hostinger-token:
    required: true
    description: 'Hostinger Access Token'

runs:
  using: "composite"
  steps:
    - name: Validate Environment / Branch Compatibility
      shell: bash
      run: |
        ENVIRONMENT="${{ inputs.environment }}"
        TARGET_BRANCH="${{ inputs.target-branch }}"

        if [ "$ENVIRONMENT" == "PROD" ]; then
          if [ "$TARGET_BRANCH" != "main" ] && [[ ! "$TARGET_BRANCH" =~ ^release/ ]]; then
            echo "ERROR: PROD deployments can only target 'main' or 'release/*' branch. Got '$TARGET_BRANCH'."
            exit 1
          fi
        elif [ "$ENVIRONMENT" == "DEV" ] || [ "$ENVIRONMENT" == "TEST" ]; then
          if [ "$TARGET_BRANCH" != "dev" ] && [ "$TARGET_BRANCH" != "test" ] && [[ ! "$TARGET_BRANCH" =~ ^(feature|bugfix|hotfix)/ ]]; then
            echo "ERROR: $ENVIRONMENT deployments can only target 'dev', 'test', 'feature/*', 'bugfix/*' or 'hotfix/*'. Got '$TARGET_BRANCH'."
            exit 1
          fi
        else
          echo "ERROR: environment must be 'DEV', 'TEST' or 'PROD'. Got '$ENVIRONMENT'."
          exit 1
        fi
        echo "SUCCESS: '$TARGET_BRANCH' is valid for environment '$ENVIRONMENT'."

    - name: Verify Target Branch Exists
      shell: bash
      run: |
        if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "refs/heads/${{ inputs.target-branch }}" >/dev/null 2>&1; then
          echo "ERROR: Branch '${{ inputs.target-branch }}' does not exist in this repository."
          exit 1
        fi
        echo "SUCCESS: Branch exists."

    - name: Initial Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.target-branch }}

    - name: Resolve Repository Name, Image Tag & Subdomain
      id: resolve
      shell: bash
      run: |
        REPOSITORY_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="${{ inputs.target-branch }}"

        if [ "${{ inputs.environment }}" == "PROD" ]; then
          if [ -f VERSION ]; then
            TAG=$(tr -d '[:space:]' < VERSION)
          else
            echo "ERROR: VERSION is required to deploy a production image."
            exit 1
          fi
          SUBDOMAIN="$REPOSITORY_NAME"
        else
          TAG=$(echo "$TARGET_BRANCH" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          BRANCH_SLUG=$(echo "$TARGET_BRANCH" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g' | sed -E 's/-{2,}/-/g')
          SUBDOMAIN="${REPOSITORY_NAME}.${BRANCH_SLUG}"
        fi

        FQDN="${SUBDOMAIN}.${{ inputs.hostinger-dns }}"
        GHCR_IMAGE="${{ inputs.image-name }}"
        if [ -z "$GHCR_IMAGE" ]; then
          REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${REPOSITORY_OWNER}/${REPOSITORY_NAME}"
        fi

        echo "Repository: $REPOSITORY_NAME | Tag: $TAG | FQDN: $FQDN"
        {
          echo "repository-name=$REPOSITORY_NAME"
          echo "tag=$TAG"
          echo "fqdn=$FQDN"
          echo "ghcr-image=$GHCR_IMAGE"
        } >> "$GITHUB_OUTPUT"

    - name: Verify Docker Image Exists in GHCR
      shell: bash
      run: |
        FULL_IMAGE="${{ steps.resolve.outputs.ghcr-image }}:${{ steps.resolve.outputs.tag }}"
        echo "Checking image availability: $FULL_IMAGE"

        echo "${{ inputs.github-token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

        if ! docker manifest inspect "$FULL_IMAGE" > /dev/null 2>&1; then
          echo "ERROR: Image '$FULL_IMAGE' not found on GHCR. Nothing to deploy."
          exit 1
        fi
        echo "SUCCESS: Image exists in GHCR."

    - name: Register DNS Record on Hostinger
      shell: bash
      run: |
        RESPONSE=$(curl -s -o /tmp/hostinger-response.json -w "%{http_code}" \
          -X PUT "https://developers.hostinger.com/api/dns/v1/zones/${{ inputs.hostinger-dns }}" \
          -H "Authorization: Bearer ${{ inputs.hostinger-token }}" \
          -H "Content-Type: application/json" \
          -d "{\"overwrite\": true, \"zone\": [{\"name\": \"$(echo ${{ steps.resolve.outputs.fqdn }} | sed 's/\.${{ inputs.hostinger-dns }}$//')\", \"type\": \"A\", \"ttl\": 300, \"records\": [{\"content\": \"${{ inputs.vps-ip }}\"}]}]}")

        echo "Hostinger API Response: $RESPONSE"
        cat /tmp/hostinger-response.json
        if [ "$RESPONSE" -ge 300 ]; then
          echo "ERROR: Failed to create/update DNS record on Hostinger."
          exit 1
        fi
        echo "SUCCESS: DNS record for ${{ steps.resolve.outputs.fqdn }} -> ${{ inputs.vps-ip }}"

    - name: SSH and Deploy
      uses: appleboy/ssh-action@v1
      env:
        REPOSITORY_NAME: ${{ steps.resolve.outputs.repository-name }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
        FQDN: ${{ steps.resolve.outputs.fqdn }}
        GHCR_IMAGE: ${{ steps.resolve.outputs.ghcr-image }}
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ inputs.github-token }}
      with:
        host: ${{ inputs.vps-ip }}
        username: ${{ inputs.vps-username }}
        key: ${{ inputs.vps-key }}
        envs: REPOSITORY_NAME,TARGET_BRANCH,IMAGE_TAG,FQDN,GHCR_IMAGE,GHCR_USER,GHCR_TOKEN
        script: |
          set -e
          CONF_NAME="${REPOSITORY_NAME}.$(echo "$TARGET_BRANCH" | tr '/' '-').conf"
          PROJECT_DIR="$HOME/projects/${REPOSITORY_NAME}/${TARGET_BRANCH}"

          echo "=== 1. Ensure required tools are installed ==="
          for pkg in docker.io docker-compose-v2 jq nginx build-essential certbot python3-certbot-nginx; do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              echo "Installing missing package: $pkg"
              sudo apt-get update -y && sudo apt-get install -y "$pkg"
            fi
          done

          echo "=== 2. Login to GHCR on VPS ==="
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          echo "=== 3. Ensure project directory ==="
          mkdir -p "$PROJECT_DIR"

          echo "=== 4. Compute or reuse PORT ==="
          ENV_FILE="${PROJECT_DIR}/.env"
          touch "$ENV_FILE"
          if grep -q '^PORT=' "$ENV_FILE"; then
            PORT=$(grep '^PORT=' "$ENV_FILE" | head -n1 | cut -d'=' -f2)
            echo "Reusing existing PORT: $PORT"
          else
            PORT=3000
            while ss -tuln | grep -q ":$PORT "; do PORT=$((PORT + 1)); done
            { echo "PORT=$PORT"; cat "$ENV_FILE"; } > /tmp/.env.new && mv /tmp/.env.new "$ENV_FILE"
            echo "Computed new PORT: $PORT"
          fi

          echo "=== 5. Ensure docker-compose.yml ==="
          COMPOSE_FILE="${PROJECT_DIR}/docker-compose.yml"
          if [ ! -f "$COMPOSE_FILE" ]; then
            cat > "$COMPOSE_FILE" <<COMPOSE
          services:
            ${REPOSITORY_NAME}_app:
              image: ${GHCR_IMAGE}:${IMAGE_TAG}
              container_name: ${REPOSITORY_NAME}_${IMAGE_TAG}
              ports:
                - "\${PORT}:\${PORT}"
              env_file:
                - ./.env
              restart: unless-stopped
          COMPOSE
            echo "Created docker-compose.yml"
          fi

          echo "=== 6. Ensure nginx site config ==="
          NGINX_CONF="/etc/nginx/sites-available/${CONF_NAME}"
          if [ ! -f "$NGINX_CONF" ]; then
            sudo tee "$NGINX_CONF" > /dev/null <<NGINX
          server {
            listen 80;
            server_name ${FQDN};
            location / {
              proxy_pass http://localhost:${PORT};
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
            }
          }
          NGINX
          fi

          echo "=== 7. Pull & run container from GHCR ==="
          cd "$PROJECT_DIR"
          docker pull "${GHCR_IMAGE}:${IMAGE_TAG}"
          docker compose up --build -d

          echo "=== 8. Link nginx & reload ==="
          sudo ln -sf "$NGINX_CONF" "/etc/nginx/sites-enabled/${CONF_NAME}"
          sudo nginx -t
          sudo systemctl restart nginx

          echo "=== 9. Certbot ==="
          if [ ! -d "/etc/letsencrypt/live/${FQDN}" ]; then
            sudo certbot --nginx -d "${FQDN}" --non-interactive --agree-tos -m "admin@${FQDN#*.}" || \
              echo "WARNING: certbot failed, check DNS propagation."
          fi

          echo "SUCCESS: Deployed ${GHCR_IMAGE}:${IMAGE_TAG} at https://${FQDN} (port ${PORT})"