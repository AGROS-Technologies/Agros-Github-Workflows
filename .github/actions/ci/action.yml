name: "CI Hub Auth Action con ClickUp"
description: "Valida commits en ClickUp, corre Gitleaks, Pytest con Postgres, Trivy y Build/Push a GHCR"

inputs:
  workflow_name:
    description: "Nombre del workflow para consultar el historial en GitHub API (ej: ci.yml)"
    required: true
  clickup_api_token:
    description: "API Token de ClickUp"
    required: true
  allowed_clickup_statuses:
    description: "Estados permitidos en ClickUp separados por comas (ej: in progress, complete)"
    required: false
    default: "in progress,complete,to do"
  image_name:
    description: "Nombre completo de la imagen en GHCR (ej: ghcr.io/org/hub-auth)"
    required: true
  trivy_image:
    description: "Imagen de Trivy"
    required: false
    default: "aquasec/trivy:0.56.2"
  python_version:
    description: "Versión de Python"
    required: false
    default: "3.11"
  ghcr_token:
    description: "Token para publicar en GHCR"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout del repositorio del consumidor
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Obtener última ejecución exitosa del Workflow
      id: fetch-last-sha
      uses: actions/github-script@v7
      with:
        script: |
          const branch = context.ref.replace('refs/heads/', '');
          const workflowName = '${{ inputs.workflow_name }}';

          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: workflowName,
            branch: branch,
            status: 'success',
            per_page: 1,
          });

          if (runs.data.total_count === 0) {
            core.setOutput('sha', '');
          } else {
            core.setOutput('sha', runs.data.workflow_runs[0].head_sha);
          }

    - name: Extraer lista de mensajes de commit a validar
      id: extract-commits
      shell: bash
      run: |
        LAST_SHA="${{ steps.fetch-last-sha.outputs.sha }}"
        
        if [ -n "$LAST_SHA" ] && ! git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
          LAST_SHA=""
        fi 

        if [ -z "$LAST_SHA" ]; then
          DEFAULT_BRANCH=$(jq -r '.repository.default_branch' "$GITHUB_EVENT_PATH")
          DIVERGED_SHA=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || echo "")
          if [ -z "$DIVERGED_SHA" ]; then
            git log --first-parent --no-merges --pretty=format:"%s" > /tmp/raw_commits.txt
          else
            git log --first-parent --no-merges "${DIVERGED_SHA}..HEAD" --pretty=format:"%s" > /tmp/raw_commits.txt
          fi
        else
          git log --first-parent --no-merges "${LAST_SHA}..HEAD" --pretty=format:"%s" > /tmp/raw_commits.txt
        fi

        EOF="COMMIT_MESSAGES_$(date +%s)"
        echo "commits<<$EOF" >> "$GITHUB_OUTPUT"
        cat /tmp/raw_commits.txt >> "$GITHUB_OUTPUT"
        echo "" >> "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

    - name: Validar Task IDs y Estados en ClickUp
      shell: bash
      env:
        CLICKUP_TOKEN: ${{ inputs.clickup_api_token }}
        ALLOWED_STATUSES: ${{ inputs.allowed_clickup_statuses }}
      run: |
        FAILED=0
        echo "${{ steps.extract-commits.outputs.commits }}" > /tmp/messages_to_process.txt

        while IFS= read -r COMMIT_MSG || [ -n "$COMMIT_MSG" ]; do
          [ -z "$COMMIT_MSG" ] && continue
          echo "Validando commit: $COMMIT_MSG"

          # Busca patrones de ID de ClickUp (ej: #CU-1234 o #1234abcd o CU-1234)
          TASK_ID=$(echo "$COMMIT_MSG" | grep -oP '(#|CU-)?\K[a-zA-Z0-9]{7,9}' | head -1 || true)
        
          if [ -z "$TASK_ID" ]; then
            echo "ERROR: No se encontró ID de tarea de ClickUp en el commit: '$COMMIT_MSG'"
            FAILED=1
            continue
          fi

          echo "Consultando tarea ClickUp: $TASK_ID..."
          RESPONSE=$(curl -sf -H "Authorization: $CLICKUP_TOKEN" "https://api.clickup.com/api/v2/task/$TASK_ID/" || true)

          if [ -z "$RESPONSE" ]; then
            echo "ERROR: No se pudo obtener la tarea $TASK_ID de ClickUp (Verifica el ID o el Token)."
            FAILED=1
            continue
          fi

          RAW_STATUS=$(echo "$RESPONSE" | jq -r '.status.status // empty')
          STATUS_NORM=$(echo "$RAW_STATUS" | tr '[:lower:]' '[:upper:]' | xargs)

          IFS=',' read -ra STATUSES_ARRAY <<< "$ALLOWED_STATUSES"
          MATCH=false
          for allowed in "${STATUSES_ARRAY[@]}"; do
            NORM_ALLOWED=$(echo "$allowed" | tr '[:lower:]' '[:upper:]' | xargs)
            if [ "$NORM_ALLOWED" == "$STATUS_NORM" ]; then
              MATCH=true
              break
            fi
          done

          if [ "$MATCH" = false ]; then
            echo "ERROR: Tarea $TASK_ID tiene el estado '$RAW_STATUS', el cual no está permitido ($ALLOWED_STATUSES)."
            FAILED=1
          else
            echo "PASSED: Tarea $TASK_ID válida (Estado: $RAW_STATUS)."
          fi

        done < /tmp/messages_to_process.txt

        if [ $FAILED -ne 0 ]; then
          echo "Fallo en la validación de ClickUp."
          exit 1
        fi

    - name: Escaneo de secretos (Gitleaks)
      shell: bash
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz gitleaks
        ./gitleaks git --redact -v --exit-code 1

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
        cache: pip

    - name: Instalar dependencias
      shell: bash
      run: pip install -r requirements.txt

    - name: Generar SECRET_KEY y llave SSO efímeras
      shell: bash
      run: |
        echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
        openssl genrsa -out /tmp/ci_sso_private.pem 2048

    - name: Preparar esquema de BD de prueba
      shell: bash
      run: |
        python - <<'PY'
        import re
        from sqlalchemy import text
        from sqlalchemy.schema import DefaultClause
        from app.core.database import Base, engine

        for table in Base.metadata.tables.values():
            for col in table.columns:
                d = col.server_default
                if d is None or isinstance(getattr(d, "arg", None), str):
                    continue
                sql = str(d.arg.compile(dialect=engine.dialect, compile_kwargs={"literal_binds": True}))
                if "interval(" in sql:
                    fixed = re.sub(r"interval\('([^']+)'\)", r"interval '\1'", sql)
                    print(f"[CI] {table.name}.{col.name}: {sql} -> {fixed}")
                    col.server_default = DefaultClause(text(fixed))
        Base.metadata.create_all(engine)
        print("[CI] Esquema de prueba creado:", sorted(Base.metadata.tables))
        PY

    - name: Ejecutar pruebas (gate bloqueante)
      shell: bash
      run: |
        mkdir -p reports
        QUARANTINE_FILE=".github/ci/pytest-quarantine.txt"
        if [ -f "$QUARANTINE_FILE" ]; then
          DESELECT=$(grep -vE '^[[:space:]]*(#|$)' "$QUARANTINE_FILE" | sed 's/^/--deselect=/' | tr '\n' ' ')
        else
          DESELECT=""
        fi
        pytest -q $DESELECT --junitxml=reports/junit.xml

    - name: Pruebas en cuarentena (no bloqueante)
      if: always()
      shell: bash
      run: |
        QUARANTINE_FILE=".github/ci/pytest-quarantine.txt"
        if [ -f "$QUARANTINE_FILE" ] && [ -s "$QUARANTINE_FILE" ]; then
          pytest -q $(grep -vE '^[[:space:]]*(#|$)' "$QUARANTINE_FILE") \
            --junitxml=reports/junit-cuarentena.xml || true
        fi

    - name: Publicar reportes de pruebas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-pytest
        path: reports/

    - name: Calcular etiquetas (sha corto y versión)
      id: vars
      shell: bash
      run: |
        echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
        BRANCH_TAG=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
        echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Etapa 1 - Construir imagen multi-stage
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        push: false
        tags: ${{ inputs.image_name }}:sha-${{ steps.vars.outputs.short }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.vars.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Prueba de humo del contenedor (/api/health)
      shell: bash
      run: |
        docker run -d --name smoke -p 8000:8000 \
          -e ENV=test -e FRONTEND_BASE_URL=http://localhost:3000 \
          -e DATABASE_URL=postgresql+psycopg2://smoke@localhost:5432/smoke \
          -e SECRET_KEY="$(openssl rand -hex 32)" \
          -e SSO_PRIVATE_KEY_PATH=/tmp/none.pem \
          -e SMTP_HOST=localhost -e SMTP_PORT=587 -e SMTP_USER=ci -e SMTP_PASSWORD=ci \
          -e SMTP_FROM_NAME=ci -e EXT_CLIENT_ID=ci -e EXT_CLIENT_SECRET=ci \
          "${{ inputs.image_name }}:sha-${{ steps.vars.outputs.short }}"
        curl --fail -sS --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/api/health \
          || { docker logs smoke; exit 1; }
        docker exec smoke id -u | grep -vx 0 && echo "OK: el contenedor no corre como root"
        docker rm -f smoke

    - name: Etapa 3a - Trivy sobre dependencias
      shell: bash
      run: |
        docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache "${{ inputs.trivy_image }}" \
          fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /src

    - name: Etapa 3b - Trivy sobre la imagen construida
      shell: bash
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "${{ inputs.trivy_image }}" \
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
          "${{ inputs.image_name }}:sha-${{ steps.vars.outputs.short }}"

    - name: Login en GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr_token }}

    - name: Publicar sha-<7>
      if: github.event_name != 'pull_request'
      shell: bash
      run: docker push "${{ inputs.image_name }}:sha-${{ steps.vars.outputs.short }}"

    - name: Publicar etiqueta de rama (DEV/TEST)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
      shell: bash
      run: |
        docker tag "${{ inputs.image_name }}:sha-${{ steps.vars.outputs.short }}" \
          "${{ inputs.image_name }}:${{ steps.vars.outputs.branch_tag }}"
        docker push "${{ inputs.image_name }}:${{ steps.vars.outputs.branch_tag }}"

    - name: Publicar versión SemVer (main y release/*)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
      shell: bash
      run: |
        V="${{ steps.vars.outputs.version }}"
        IMAGE="${{ inputs.image_name }}"
        if docker manifest inspect "$IMAGE:$V" > /dev/null 2>&1; then
          echo "::notice::La versión $V ya existe en GHCR; no se sobrescribe."
        else
          docker tag "$IMAGE:sha-${{ steps.vars.outputs.short }}" "$IMAGE:$V"
          docker push "$IMAGE:$V"
        fi