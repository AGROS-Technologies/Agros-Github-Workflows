name: Publish Image on GHCR
description: Builds and pushes a Docker Image to GitHub Container Registry (GHCR) under a given tag.

inputs:
  github-token:
    required: true
    description: 'GitHub Personal Access Token or GITHUB_TOKEN with packages:write permission'
  image-name:
    required: false
    description: 'Full image name (e.g. ghcr.io/agrofusion-mdu-prototipo/hub-auth). If omitted, inferred from context.'
    default: ''
  image-tag:
    required: true
    description: 'Image Tag to Build and Push (e.g. sha-a36a6a0 or 1.0.0)'

outputs:
  full-image:
    value: ${{ steps.summary.outputs.full-image }}
  was-updated:
    value: ${{ steps.check-tag.outputs.exists }}

runs:
  using: "composite"
  steps:
    - name: Resolve Full GHCR Image Name
      id: ghcr-repo
      shell: bash
      run: |
        if [ -n "${{ inputs.image-name }}" ]; then
          IMAGE_PATH="${{ inputs.image-name }}"
        else
          # Construye automáticamente ghcr.io/<org>/<repo-name> en minúsculas
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PATH="ghcr.io/${REPO_LOWER}"
        fi
        
        echo "path=${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

    - name: Login to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Check if Tag Already Exists in GHCR
      id: check-tag
      shell: bash
      run: |
        TARGET_IMAGE="${{ steps.ghcr-repo.outputs.path }}:${{ inputs.image-tag }}"
        
        if docker manifest inspect "$TARGET_IMAGE" > /dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag '$TARGET_IMAGE' already exists in GHCR."
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Tag '$TARGET_IMAGE' is new."
        fi

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push to GHCR
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.ghcr-repo.outputs.path }}:${{ inputs.image-tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Print Summary
      id: summary
      shell: bash
      run: |
        FULL_TAG="${{ steps.ghcr-repo.outputs.path }}:${{ inputs.image-tag }}"
        echo "full-image=$FULL_TAG" >> "$GITHUB_OUTPUT"
        
        if [ "${{ steps.check-tag.outputs.exists }}" == "true" ]; then
          echo "Image tag already existed. Updated: $FULL_TAG"
        else
          echo "Image tag is new. Created: $FULL_TAG"
        fi
        echo "GHCR Link: https://github.com/orgs/${{ github.repository_owner }}/packages"