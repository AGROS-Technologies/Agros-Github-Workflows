name: Create Validated Git Branch with ClickUp
description: Validates ClickUp Task Status to create a new Git Branch from a base reference.

inputs:
  branch-name:
    description: 'Name of the branch to be validated and created (must contain ClickUp Task ID)'
    required: true
  branch-type:
    description: 'Prefix for the branch, it can be feature or bugfix'
    required: true
  allowed-clickup-statuses:
    description: 'Comma-separated list of allowed ClickUp task statuses'
    required: true
  clickup-api-token:
    description: 'ClickUp API Personal Token'
    required: true
  github-token:
    description: 'GitHub App Installation Token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Initial Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token }}
        fetch-depth: 0

    - name: Validate Branch Name Format & Extract ClickUp Task ID
      id: validate-branch-name
      shell: bash
      run: |
        node --input-type=module << 'EOF'
        import * as fs from 'fs';

        const branchName = "${{ inputs.branch-name }}";

        if (!/^[A-Za-z0-9-_]+$/.test(branchName)) {
          console.error(`ERROR: Branch Name "${branchName}" is invalid.`);
          console.error('Use only letters, numbers, underscores, and hyphens.');
          process.exit(1);
        }

        // Extrae el ID de ClickUp (7 a 9 caracteres alfanuméricos)
        const taskIdMatch = branchName.match(/(#|CU-)?([a-zA-Z0-9]{7,9})/);
        
        if (!taskIdMatch) {
          console.error(`ERROR: No ClickUp Task ID found inside branch name "${branchName}".`);
          console.error('Expected format inside branch name: CU-1234abcd, #1234abcd, or 1234abcd');
          process.exit(1);
        }

        const taskId = taskIdMatch[2];
        console.log(`Valid Branch Name: ${branchName}`);
        console.log(`Extracted ClickUp Task ID: ${taskId}`);

        const githubOutput = process.env.GITHUB_OUTPUT;
        fs.appendFileSync(githubOutput, `validBranchName=${branchName}\n`);
        fs.appendFileSync(githubOutput, `clickUpTaskId=${taskId}\n`);
        EOF

    - name: Fetch and Validate ClickUp Task Status
      shell: bash
      env:
        CLICKUP_TOKEN: ${{ inputs.clickup-api-token }}
        TASK_ID: ${{ steps.validate-branch-name.outputs.clickUpTaskId }}
        ALLOWED_STATUSES: ${{ inputs.allowed-clickup-statuses }}
      run: |
        echo "Consultando tarea $TASK_ID en la API de ClickUp..."

        RESPONSE=$(curl -sf -H "Authorization: $CLICKUP_TOKEN" "https://api.clickup.com/api/v2/task/$TASK_ID/" || true)

        if [ -z "$RESPONSE" ]; then
          echo "ERROR: No se pudo encontrar la tarea $TASK_ID en ClickUp o el API Token es inválido."
          exit 1
        fi

        RAW_STATUS=$(echo "$RESPONSE" | jq -r '.status.status // empty')
        
        if [ -z "$RAW_STATUS" ]; then
          echo "ERROR: La respuesta de ClickUp no contiene un estado válido."
          exit 1
        fi

        STATUS_NORM=$(echo "$RAW_STATUS" | tr '[:lower:]' '[:upper:]' | xargs)
        echo "Estado actual en ClickUp: '$RAW_STATUS' (Normalizado: '$STATUS_NORM')"

        IFS=',' read -ra STATUSES_ARRAY <<< "$ALLOWED_STATUSES"
        STATUS_MATCH=false

        for allowed in "${STATUSES_ARRAY[@]}"; do
          NORM_ALLOWED=$(echo "$allowed" | tr '[:lower:]' '[:upper:]' | xargs)
          if [ "$NORM_ALLOWED" == "$STATUS_NORM" ]; then
            STATUS_MATCH=true
            break
          fi
        done

        if [ "$STATUS_MATCH" = false ]; then
          echo "ERROR: El estado de la tarea ($RAW_STATUS) no está permitido. Estados permitidos: [$ALLOWED_STATUSES]."
          exit 1
        fi

        echo "PASSED: La tarea $TASK_ID está en un estado válido ($RAW_STATUS)."

    - name: Validate Ref Branch
      id: validate-ref-branch
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        node --input-type=module << 'EOF'
        import { execSync } from 'child_process';
        import * as fs from 'fs';

        const branchType = "${{ inputs.branch-type }}";
        let refBranch = "";

        if (branchType !== "feature" && branchType !== "bugfix") {
          console.error(`ERROR: Type Branch "${branchType}" not supported.`);
          process.exit(1);
        } else if (branchType === "feature") {
          refBranch = process.env.DEFAULT_BRANCH;
        } else {
          try {
            const rawLatestTag = execSync('git describe --tags --abbrev=0', { encoding: 'utf8' }).trim();
            console.log(`Latest tag found: ${rawLatestTag}`);
            const formattedLatestTag = rawLatestTag.slice(0, 3);
            refBranch = `release/${formattedLatestTag}`;
            try {
              execSync(`git ls-remote --exit-code origin refs/heads/${refBranch}`, { stdio: 'ignore' });
              console.log(`Matching release branch found. Using ${refBranch}`);
            } catch {
              console.error(`Branch "${refBranch}" does not exist on remote.`);
              process.exit(1);
            }
          } catch {
            console.error(`No tags found in the repository history.`);
            process.exit(1);
          }
        }

        const outputName = 'refBranch';
        const githubOutput = process.env.GITHUB_OUTPUT;

        fs.appendFileSync(githubOutput, `${outputName}=${refBranch}\n`);
        console.log(`Set output ${outputName} to ${refBranch}\n`);

        EOF

    - name: Checkout Ref Branch
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token }}
        ref: ${{ steps.validate-ref-branch.outputs.refBranch }}
        fetch-depth: 0

    - name: Create and Push Git Branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO_FULL_NAME: ${{ github.repository }}
      run: |
        node --input-type=module << 'EOF'
        import { execSync } from 'child_process';

        const branchName = "${{ steps.validate-branch-name.outputs.validBranchName }}";
        const branchType = "${{ inputs.branch-type }}";
        const token = process.env.GH_TOKEN;
        const repository = process.env.REPO_FULL_NAME;

        let branchNameFormatted = `${branchType}/${branchName}`;

        console.log(`Formatted Branch Name: ${branchNameFormatted}`);
        console.log(`Validating if target branch to create already exists in remote...`);

        try {
          execSync(`git ls-remote --exit-code origin refs/heads/${branchNameFormatted}`, { stdio: 'ignore' });
          console.error(`ERROR: Branch "${branchNameFormatted}" already exists on remote origin.`);
          process.exit(1);
        } catch {
          console.log(`SUCCESS: Branch "${branchNameFormatted}" is safe to create on remote origin.`);
        }

        execSync(`git remote set-url origin https://x-access-token:${token}@github.com/${repository}.git`);

        // Bot estándar de GitHub Actions
        execSync('git config user.name "github-actions[bot]"');
        execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

        execSync(`git checkout -b ${branchNameFormatted}`);
        execSync(`git push origin ${branchNameFormatted}`);

        console.log(`SUCCESS: Branch "${branchNameFormatted}" created and pushed.`);

        EOF