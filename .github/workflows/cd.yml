name: CD Reusable Workflow

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Tag de la imagen en GHCR"
        required: false
        type: string
        default: ""
      branch_override:
        description: "Rama objetivo"
        required: false
        type: string
        default: ""
      sha_override:
        description: "SHA objetivo"
        required: false
        type: string
        default: ""
    secrets:
      ghcr_token:
        required: false
      dev_db_password:
        required: false
      test_db_password:
        required: false
      prod_db_password:
        required: false
      jwt_secret:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  cd:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch_override || github.event.workflow_run.head_branch || github.ref_name }}
      SHA: ${{ inputs.sha_override || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Llama a la Action de CD del Repo Central
        uses: agrofusion-mdu-prototipo/Ops-Github-Workflows/.github/actions/cd-action@main
        with:
          image_tag_input: ${{ inputs.image_tag }}
          ghcr_token: ${{ secrets.ghcr_token || secrets.GITHUB_TOKEN }}
          jwt_secret: ${{ secrets.jwt_secret }}
          db_password: ${{ (env.BRANCH == 'main' && secrets.prod_db_password) || (env.BRANCH == 'test' && secrets.test_db_password) || secrets.dev_db_password }}