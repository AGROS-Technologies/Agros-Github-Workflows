name: Create Branch

on:
  workflow_call:
    inputs:
      branch-name:
        description: >
          Nombre de la rama con ID de tarea de ClickUp
          Ejemplo: 1234abcd-add-user-module
        required: true
        type: string
      branch-type:
        description: >
          Tipo de rama a crear ("feature", "bugfix")
        required: true
        type: string
      allowed-clickup-statuses:
        description: >
          Estados permitidos en ClickUp separados por comas
          Ejemplo: in progress, to do, open
        required: true
        type: string
    secrets:
      BOT_CLIENT_ID:
        required: false
      BOT_APP_PRIVATE_KEY:
        required: false
      CLICKUP_API_TOKEN:
        required: true

jobs:
  create-branch:
    name: Validate and Create Branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        if: ${{ secrets.BOT_CLIENT_ID != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Execute Branch Creation Action
        uses: AGROS-Technologies/Agros-Github-Workflows/.github/actions/create-branch@main
        with:
          branch-name: ${{ inputs.branch-name }}
          branch-type: ${{ inputs.branch-type }}
          allowed-clickup-statuses: ${{ inputs.allowed-clickup-statuses }}
          clickup-api-token: ${{ secrets.CLICKUP_API_TOKEN }}
          github-token: ${{ steps.github-app-token.outputs.token || secrets.GITHUB_TOKEN }}