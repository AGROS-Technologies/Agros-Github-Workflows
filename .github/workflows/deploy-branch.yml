name: Deploy Branch in a Certain Environment

on:
  workflow_call:
    inputs:
      target-branch:
        required: true
        description: 'Target Branch to Deploy'
        type: string
      environment:
        required: true
        description: 'Environment to Deploy ("DEV", "TEST", "PROD")'
        type: string
      image_name:
        required: false
        description: 'Full GHCR image name, matching the CI workflow (e.g. ghcr.io/org/app)'
        type: string
        default: ''
    secrets:
      VPS_IP:
        required: true
      VPS_PRIVATE_KEY:
        required: true
      VPS_USERNAME:
        required: true
      HOSTINGER_MAIN_DNS:
        required: true
      HOSTINGER_TOKEN:
        required: true
      GHCR_TOKEN:
        required: false

jobs:
  update-env:
    name: Deploy Branch in VPS
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deploy Branch Action
        uses: agrofusion-mdu-prototipo/Ops-Github-Workflows/.github/actions/deploy-branch@main
        with:
          target-branch: ${{ inputs.target-branch }}
          environment: ${{ inputs.environment }}
          image-name: ${{ inputs.image_name }}
          vps-ip: ${{ secrets.VPS_IP }}
          vps-key: ${{ secrets.VPS_PRIVATE_KEY }}
          vps-username: ${{ secrets.VPS_USERNAME }}
          github-token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          hostinger-dns: ${{ secrets.HOSTINGER_MAIN_DNS }}
          hostinger-token: ${{ secrets.HOSTINGER_TOKEN }}