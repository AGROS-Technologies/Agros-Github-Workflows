name: CI Hub Auth Legacy Compatibility

on:
  workflow_call:
    inputs:
      workflow_name:
        required: false
        type: string
        default: "ci.yml"
      allowed_clickup_statuses:
        required: false
        type: string
        default: "in progress,complete,to do"
      image_name:
        required: true
        type: string
      trivy_image:
        required: false
        type: string
        default: "aquasec/trivy:0.56.2"
    secrets:
      clickup_api_token:
        required: true
      ghcr_token:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  ci-python:
    uses: ./.github/workflows/ci-hub-auth.yml
    with:
      workflow_name: ${{ inputs.workflow_name }}
      allowed_clickup_statuses: ${{ inputs.allowed_clickup_statuses }}
      image_name: ${{ inputs.image_name }}
      trivy_image: ${{ inputs.trivy_image }}
    secrets: inherit
