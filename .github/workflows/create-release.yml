name: Create Release

on:
  workflow_call:
    secrets:
      BOT_CLIENT_ID:
        required: false
      BOT_APP_PRIVATE_KEY:
        required: false

jobs:
  create-branch:
    name: Validate and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        if: ${{ secrets.BOT_CLIENT_ID != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Execute Release Creation Action
        uses: agrofusion-mdu-prototipo/Ops-Github-Workflows/.github/actions/create-release@main
        with:
          github-token: ${{ steps.github-app-token.outputs.token || secrets.GITHUB_TOKEN }}